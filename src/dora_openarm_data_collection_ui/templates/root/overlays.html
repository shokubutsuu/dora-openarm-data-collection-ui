<div id="cooldown-toast" class="cooldown-toast">{{ t("cooldown") }}</div>
<div class="overlay" id="connection-lost">
  <div class="title">⚠ {{ t("connection_lost_title") }}</div>
  <div class="hint">
    {{ t("connection_lost_hint") }}<br>
    {{ t("connection_lost_action") }}
  </div>
  <a class="btn" href="{{ launcher_url }}">{{ t("back_to_launcher") }}</a>
</div>
<div class="overlay" id="ending-panel">
  <div class="title">{{ t("quitting") }}</div>
  <div class="hint" id="ending-hint">
    {{ t("ending_hint") }}
  </div>
  <div id="ending-actions" hidden>
    <a class="btn" href="{{ launcher_url }}">{{ t("check_launcher") }}</a>
  </div>
</div>
